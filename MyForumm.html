<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyForumm</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap');
        * { font-family: 'Inter', sans-serif; }
        .tab-btn.active { background: #e0e7ff; color: #4338ca; font-weight: 600; }
        .file-input { font-size: 0.75rem; }
        .modal-overlay { backdrop-filter: blur(3px); }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: #818cf8; border-radius: 10px; }

        .product-card { transition: all 0.2s ease; }
        .product-card:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(0,0,0,0.08); }
        .admin-toggle { transition: all 0.2s ease; }
        .admin-toggle.active { background: #10b981; }
        .admin-toggle.inactive { background: #ef4444; }
        .img-thumb { cursor: pointer; transition: transform .15s; }
        .img-thumb:hover { transform: scale(1.03); }
        .line-clamp-2 { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }

        .readonly-field { background:#f3f4f6; color:#6b7280; cursor:not-allowed; border-color:#d1d5db !important; }
        .cart-selected { border-color:#10b981 !important; background: #ecfdf5 !important; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col">
    <div id="app" class="flex-1 flex flex-col"></div>
    <div id="modalContainer"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, get, update, remove, push, onValue, onDisconnect } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDafsnHRJpk5cM9eXvTWfwuQy1QOgBJ0TA",
            authDomain: "ilovalarim-944d0.firebaseapp.com",
            databaseURL: "https://ilovalarim-944d0-default-rtdb.firebaseio.com",
            projectId: "ilovalarim-944d0",
            storageBucket: "ilovalarim-944d0.firebasestorage.app",
            messagingSenderId: "120782588271",
            appId: "1:120782588271:web:161269f048b218c52bc09a"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        function playBeep(times = 3, freq = 1200, dur = 100, gap = 80) {
            try {
                const Ctx = window.AudioContext || window.webkitAudioContext;
                if (!Ctx) return;
                const ctx = new Ctx();
                let start = ctx.currentTime;
                for (let i = 0; i < times; i++) {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'square';
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.0001, start);
                    gain.gain.exponentialRampToValueAtTime(0.35, start + 0.01);
                    gain.gain.exponentialRampToValueAtTime(0.0001, start + dur / 1000);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(start);
                    osc.stop(start + dur / 1000);
                    start += (dur + gap) / 1000;
                }
                setTimeout(() => { try { ctx.close(); } catch (e) {} }, (times * (dur + gap)) + 300);
            } catch (e) { console.warn('Beep error:', e); }
        }

        const CACHE = { user: null, arizaTurlari: null, arizalar: null, yangiliklar: null, holatlar: null, users: null, xabarlar: null, sorovnomalar: null, sorovnomaTurlari: null, mahsulotlar: null, buyurtmalar: null, adminRuxsatlar: null, bolimSozlamalari: null, buyurtmaMaydonlar: null, fikrlar: null };
        let profiles = JSON.parse(localStorage.getItem('app_profiles')) || [];
        let currentProfileId = localStorage.getItem('current_profile_id') || null;
        let readItems = JSON.parse(localStorage.getItem('app_read_items')) || [];
        let savat = {};
        let savatSelected = {};
        try { savat = currentProfileId ? (JSON.parse(localStorage.getItem('app_savat_' + currentProfileId)) || {}) : {}; } catch(e) { savat = {}; }
        try { savatSelected = currentProfileId ? (JSON.parse(localStorage.getItem('app_savat_selected_' + currentProfileId)) || {}) : {}; } catch(e) { savatSelected = {}; }

        function saveSavat() { if (currentProfileId) localStorage.setItem('app_savat_' + currentProfileId, JSON.stringify(savat)); updateCartBadge(); }
        function loadSavat() { try { savat = currentProfileId ? (JSON.parse(localStorage.getItem('app_savat_' + currentProfileId)) || {}) : {}; } catch(e) { savat = {}; } }
        function saveSavatSelected() { if (currentProfileId) localStorage.setItem('app_savat_selected_' + currentProfileId, JSON.stringify(savatSelected)); }
        function loadSavatSelected() { try { savatSelected = currentProfileId ? (JSON.parse(localStorage.getItem('app_savat_selected_' + currentProfileId)) || {}) : {}; } catch(e) { savatSelected = {}; } }
        function updateCartBadge() {
            const badge = document.getElementById('badge_savat');
            const cnt = Object.values(savat).reduce((s, x) => s + (parseInt(x.soni) || 0), 0);
            if (badge) { if (cnt > 0) { badge.innerText = cnt; badge.classList.remove('hidden'); } else badge.classList.add('hidden'); }
        }

        function markAsRead(itemId) {
            if (!readItems.includes(itemId)) { readItems.push(itemId); localStorage.setItem('app_read_items', JSON.stringify(readItems)); updateBadges(); }
        }

        const DEFAULT_BOLIMLAR = {
            ariza:          { nomi: 'Ariza',           rang: '#6366f1', icon: 'fa-file-lines' },
            arizalarim:     { nomi: 'Arizalarim',      rang: '#6366f1', icon: 'fa-folder-open' },
            sorovnoma:      { nomi: 'So‘rovnoma',      rang: '#10b981', icon: 'fa-rectangle-list' },
            sorovnomalarim: { nomi: 'So‘rovnomalarim', rang: '#10b981', icon: 'fa-copy' },
            uzum:           { nomi: 'Uzum Market',     rang: '#a855f7', icon: 'fa-bag-shopping' },
            savat:          { nomi: 'Savat',           rang: '#f59e0b', icon: 'fa-cart-shopping' },
            buyurtmalarim:  { nomi: 'Buyurtmalarim',   rang: '#a855f7', icon: 'fa-box-open' },
            yangiliklar:    { nomi: 'Yangiliklar',     rang: '#6366f1', icon: 'fa-newspaper' },
            xabarlar:       { nomi: 'Xabarlar',        rang: '#6366f1', icon: 'fa-message' },
            profillarim:    { nomi: 'Profillarim',     rang: '#6366f1', icon: 'fa-users' }
        };

        async function initSystem() {
            const usersSnap = await get(ref(db, 'users'));
            if (!usersSnap.exists()) {
                const newId = Math.floor(100000 + Math.random() * 900000).toString();
                await set(ref(db, `users/${newId}`), { id: newId, pin: "1234", role: 'admin', status: 'offline', lastSeen: new Date().toISOString(), blocked: false });
                profiles = [{ id: newId, pin: "1234", role: 'admin' }];
                localStorage.setItem('app_profiles', JSON.stringify(profiles));
                currentProfileId = newId; localStorage.setItem('current_profile_id', currentProfileId);
            } else if (profiles.length === 0) {
                const users = usersSnap.val(); const firstId = Object.keys(users)[0];
                profiles.push(users[firstId]); localStorage.setItem('app_profiles', JSON.stringify(profiles));
                currentProfileId = firstId; localStorage.setItem('current_profile_id', currentProfileId);
            }
            if (currentProfileId) {
                const check = await get(ref(db, `users/${currentProfileId}`));
                if (!check.exists()) { profiles = profiles.filter(p => p.id !== currentProfileId); localStorage.setItem('app_profiles', JSON.stringify(profiles)); currentProfileId = profiles.length ? profiles[0].id : null; localStorage.setItem('current_profile_id', currentProfileId || ''); }
            }
            const active = profiles.find(p => p.id === currentProfileId);
            if (!active && profiles.length) { currentProfileId = profiles[0].id; localStorage.setItem('current_profile_id', currentProfileId); }
            loadSavat();
            loadSavatSelected();
            renderAuthOrDashboard();
        }

        function setupPresence(userId) {
            if (!userId) return;
            const refUser = ref(db, `users/${userId}`);
            update(refUser, { status: 'online', lastSeen: new Date().toISOString() });
            onDisconnect(refUser).update({ status: 'offline', lastSeen: new Date().toISOString() });
        }

        async function getCurrentUser(force = false) {
            if (!currentProfileId) return null;
            if (!force && CACHE.user && CACHE.user.id === currentProfileId) return CACHE.user;
            const snap = await get(ref(db, `users/${currentProfileId}`));
            if (snap.exists()) { CACHE.user = snap.val(); return CACHE.user; }
            return null;
        }

        async function getAdminRuxsatlarFor(adminId, force = false) {
            const s = await get(ref(db, `adminRuxsatlar/${adminId}`));
            return s.exists() ? s.val() : {};
        }
        async function hasAdminPermFor(adminId, key) {
            const r = await getAdminRuxsatlarFor(adminId);
            if (!r || Object.keys(r).length === 0) return true;
            return r[key] !== false;
        }

        async function getBolimSozlamalari(force = false) {
            if (!force && CACHE.bolimSozlamalari) return CACHE.bolimSozlamalari;
            const s = await get(ref(db, 'bolimSozlamalari'));
            const saved = s.exists() ? s.val() : {};
            const merged = {};
            for (let k in DEFAULT_BOLIMLAR) merged[k] = { ...DEFAULT_BOLIMLAR[k], ...(saved[k] || {}) };
            CACHE.bolimSozlamalari = merged;
            return merged;
        }

        async function getBuyurtmaMaydonlar(force = false) {
            if (!force && CACHE.buyurtmaMaydonlar) return CACHE.buyurtmaMaydonlar;
            const s = await get(ref(db, 'buyurtmaMaydonlar'));
            CACHE.buyurtmaMaydonlar = s.exists() ? s.val() : {};
            return CACHE.buyurtmaMaydonlar;
        }

        async function getFikrlarCached(force = false) {
            if (!force && CACHE.fikrlar) return CACHE.fikrlar;
            const s = await get(ref(db, 'fikrlar'));
            CACHE.fikrlar = s.exists() ? s.val() : {};
            return CACHE.fikrlar;
        }

        async function renderAuthOrDashboard() {
            const appDiv = document.getElementById('app');
            const user = await getCurrentUser(true);
            if (!user) { appDiv.innerHTML = `<div class="p-8 text-center text-red-500 font-bold">Profil topilmadi!</div>`; return; }
            if (user.blocked) { appDiv.innerHTML = `<div class="p-8 text-center text-red-600 font-bold text-xl">ID ${user.id} bloklangan!</div>`; return; }
            if (!sessionStorage.getItem(`auth_${user.id}`)) { renderPinPrompt(appDiv, user); return; }
            setupPresence(user.id);
            renderMainDashboard(appDiv, user);
        }

        function renderPinPrompt(container, user) {
            container.innerHTML = `
                <div class="flex-1 flex items-center justify-center p-4 bg-gradient-to-br from-indigo-50 to-purple-50">
                    <div class="bg-white/80 backdrop-blur-md p-8 rounded-3xl shadow-2xl w-full max-w-md border border-indigo-100 text-center space-y-6">
                        <div class="w-20 h-20 bg-gradient-to-br from-indigo-500 to-purple-600 text-white rounded-2xl flex items-center justify-center mx-auto text-3xl shadow-lg"><i class="fa-solid fa-shield-halved"></i></div>
                        <div><h1 class="text-2xl font-extrabold text-gray-800">Kirish</h1><p class="text-sm text-gray-500 mt-1">ID: <span class="font-bold text-indigo-600">${user.id}</span> · ${user.role.toUpperCase()}</p></div>
                        <div class="space-y-4">
                            <input type="password" id="pinInput" placeholder="Himoya paroli" class="w-full px-5 py-3.5 border-2 border-indigo-200 rounded-2xl text-center text-xl tracking-widest font-bold focus:ring-4 focus:ring-indigo-300 focus:outline-none bg-white/70">
                            <button id="verifyPinBtn" class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 text-white py-3.5 rounded-2xl font-bold shadow-lg hover:shadow-xl transition"><i class="fa-regular fa-circle-check mr-2"></i> Kirish</button>
                        </div>
                        <div class="pt-2"><button id="adminLoginBtn" class="w-full bg-gradient-to-r from-purple-700 to-pink-600 text-white py-2.5 rounded-2xl font-semibold text-sm shadow hover:shadow-lg transition"><i class="fa-solid fa-crown mr-2"></i> Admin sifatida kirish</button></div>
                        <div class="pt-4 border-t flex flex-wrap justify-between items-center text-xs text-gray-500 gap-2">
                            <select id="quickProfileSwitch" class="border-2 border-indigo-200 px-3 py-1.5 rounded-xl font-medium bg-white/70 text-indigo-700">${profiles.map(p => `<option value="${p.id}" ${p.id === user.id ? 'selected' : ''}>ID: ${p.id} (${p.role})</option>`).join('')}</select>
                            <button id="loginWithExistingIdBtn" class="border-2 border-purple-500 text-purple-700 px-3 py-1.5 rounded-xl text-xs font-bold hover:bg-purple-50"><i class="fa-regular fa-id-card mr-1"></i> ID kirit</button>
                            <button id="createProfileFromPinBtn" class="border-2 border-indigo-500 text-indigo-700 px-3 py-1.5 rounded-xl text-xs font-bold hover:bg-indigo-50"><i class="fa-solid fa-user-plus mr-1"></i> Yangi ID</button>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('verifyPinBtn').addEventListener('click', async () => {
                const pin = document.getElementById('pinInput').value.trim();
                const snap = await get(ref(db, `users/${user.id}`)); const dbUser = snap.exists() ? snap.val() : user;
                if (dbUser.blocked) { alert("ID bloklangan!"); return; }
                if (pin === (dbUser.pin || "1234")) { sessionStorage.setItem(`auth_${user.id}`, "true"); renderAuthOrDashboard(); }
                else alert("Noto'g'ri parol!");
            });
            document.getElementById('adminLoginBtn').addEventListener('click', async () => {
                const p = prompt("Admin paroli:"); if (p === "900") { await update(ref(db, `users/${user.id}`), { role: 'admin' }); sessionStorage.setItem(`auth_${user.id}`, "true"); sessionStorage.setItem(`admin_verified_${user.id}`, "true"); CACHE.user = null; renderAuthOrDashboard(); } else alert("Xato");
            });
            document.getElementById('loginWithExistingIdBtn').addEventListener('click', async () => {
                const id = prompt("ID:"); if (!id) return; const snap = await get(ref(db, `users/${id.trim()}`)); if (!snap.exists()) { alert("Yo'q"); return; }
                const data = snap.val(); if (data.blocked) { alert("Bloklangan"); return; }
                const pin = prompt(`ID ${id} parol:`); if (pin === null) return;
                if (pin.trim() === (data.pin || "1234")) { if (!profiles.some(p => p.id === data.id)) { profiles.push(data); localStorage.setItem('app_profiles', JSON.stringify(profiles)); } currentProfileId = data.id; localStorage.setItem('current_profile_id', currentProfileId); loadSavat(); loadSavatSelected(); sessionStorage.setItem(`auth_${data.id}`, "true"); CACHE.user = null; renderAuthOrDashboard(); } else alert("Parol xato");
            });
            document.getElementById('quickProfileSwitch').addEventListener('change', (e) => { currentProfileId = e.target.value; localStorage.setItem('current_profile_id', currentProfileId); loadSavat(); loadSavatSelected(); CACHE.user = null; renderAuthOrDashboard(); });
            document.getElementById('createProfileFromPinBtn').addEventListener('click', async () => {
                let newId; let exists = true; while (exists) { newId = Math.floor(100000 + Math.random() * 900000).toString(); const s = await get(ref(db, `users/${newId}`)); exists = s.exists(); }
                const p = { id: newId, pin: "1234", role: 'odam', status: 'offline', lastSeen: new Date().toISOString(), blocked: false };
                await set(ref(db, `users/${newId}`), p); if (!profiles.some(x => x.id === newId)) { profiles.push(p); localStorage.setItem('app_profiles', JSON.stringify(profiles)); }
                currentProfileId = newId; localStorage.setItem('current_profile_id', currentProfileId); loadSavat(); loadSavatSelected(); CACHE.user = null; renderAuthOrDashboard();
            });
        }

        async function renderMainDashboard(container, user) {
            const isAdmin = user.role === 'admin';
            const permSnap = await get(ref(db, `ruxsatlar/${user.id}`));
            const perms = permSnap.exists() ? permSnap.val() : {};
            const hasPerm = (key) => { if (isAdmin) return true; if (key.startsWith('admin_')) return false; return perms[key] !== false; };

            const adminPerms = isAdmin ? await getAdminRuxsatlarFor(user.id, true) : {};
            const hasAdminPerm = (key) => {
                if (!isAdmin) return false;
                if (!adminPerms || Object.keys(adminPerms).length === 0) return true;
                return adminPerms[key] !== false;
            };

            const bs = await getBolimSozlamalari();
            const bsBtn = (key, defNomi, defIcon) => {
                const b = bs[key] || {};
                const nomi = b.nomi || defNomi;
                const rang = b.rang || '#6366f1';
                const icon = b.icon || defIcon;
                return { nomi, rang, icon };
            };
            const mkBtn = (key, defNomi, defIcon, badgeId = '') => {
                const b = bsBtn(key, defNomi, defIcon);
                const badgeHtml = badgeId ? `<span id="${badgeId}" class="bg-red-500 text-white text-xs px-2 py-0.5 rounded-full font-bold hidden">0</span>` : '';
                return `<button onclick="switchTab('${key}')" class="w-full text-left px-4 py-2.5 rounded-2xl font-medium text-sm transition flex items-center justify-between tab-btn" data-tab="${key}"><span><i class="fa-solid ${b.icon} mr-3" style="color:${b.rang}"></i>${b.nomi}</span>${badgeHtml}</button>`;
            };

            container.innerHTML = `
                <header class="bg-white/80 backdrop-blur-md border-b border-indigo-100 shadow-sm sticky top-0 z-40">
                    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
                        <div class="flex items-center gap-4">
                            <span class="bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-bold px-4 py-1.5 rounded-2xl text-sm shadow">ID: ${user.id}</span>
                            <span class="text-xs uppercase font-bold px-3 py-1 rounded-full ${isAdmin ? 'bg-purple-200 text-purple-800' : 'bg-blue-200 text-blue-800'}">${user.role}</span>
                        </div>
                        <div class="flex items-center gap-2">
                            ${isAdmin && hasAdminPerm('admin_panel') ? `<button onclick="openAdminGate()" class="text-xs bg-purple-600 text-white font-bold px-4 py-2 rounded-2xl shadow hover:bg-purple-700 transition"><i class="fa-solid fa-shield-halved mr-1"></i> Admin</button>` : ''}
                            <button onclick="logoutUser('${user.id}')" class="text-xs bg-red-50 text-red-600 font-bold px-4 py-2 rounded-2xl hover:bg-red-100 transition"><i class="fa-regular fa-right-from-bracket mr-1"></i> Chiqish</button>
                        </div>
                    </div>
                </header>
                <div class="max-w-7xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-4 gap-6 flex-1">
                    <div class="lg:col-span-1 space-y-2">
                        <div class="bg-white/70 backdrop-blur-sm p-4 rounded-3xl shadow-sm border border-indigo-100 space-y-1">
                            <div class="text-xs font-bold text-gray-400 px-3 uppercase tracking-wider mb-1">Menyular</div>
                            ${hasPerm('ariza') ? mkBtn('ariza', 'Ariza', 'fa-file-lines') : ''}
                            ${hasPerm('arizalarim') ? mkBtn('arizalarim', 'Arizalarim', 'fa-folder-open') : ''}
                            ${hasPerm('sorovnoma') ? mkBtn('sorovnoma', 'So‘rovnoma', 'fa-rectangle-list') : ''}
                            ${hasPerm('sorovnomalarim') ? mkBtn('sorovnomalarim', 'So‘rovnomalarim', 'fa-copy') : ''}
                            ${hasPerm('uzum') ? mkBtn('uzum', 'Uzum Market', 'fa-bag-shopping') : ''}
                            ${hasPerm('uzum') ? mkBtn('savat', 'Savat', 'fa-cart-shopping', 'badge_savat') : ''}
                            ${hasPerm('buyurtmalarim') ? mkBtn('buyurtmalarim', 'Buyurtmalarim', 'fa-box-open') : ''}
                            ${hasPerm('yangiliklar') ? mkBtn('yangiliklar', 'Yangiliklar', 'fa-newspaper', 'badge_yangiliklar') : ''}
                            ${hasPerm('xabarlar') ? mkBtn('xabarlar', 'Xabarlar', 'fa-message', 'badge_xabarlar') : ''}
                            ${hasPerm('profillarim') ? mkBtn('profillarim', 'Profillarim', 'fa-users') : ''}
                            ${isAdmin ? `
                                <hr class="my-3 border-indigo-200">
                                <div class="text-xs font-bold text-purple-600 px-3 uppercase tracking-wider mb-1">⚙️ Boshqaruv</div>
                                ${hasAdminPerm('admin_arizalar') ? `<button onclick="checkAdminPasswordAndSwitch('admin_arizalar')" class="w-full text-left px-4 py-2.5 rounded-2xl font-medium text-sm transition flex items-center gap-3 tab-btn" data-tab="admin_arizalar"><i class="fa-regular fa-shield text-purple-500 mr-3"></i>Arizalar</button>` : ''}
                                ${hasAdminPerm('admin_sorovnomalar') ? `<button onclick="checkAdminPasswordAndSwitch('admin_sorovnomalar')" class="w-full text-left px-4 py-2.5 rounded-2xl font-medium text-sm transition flex items-center gap-3 tab-btn" data-tab="admin_sorovnomalar"><i class="fa-regular fa-rectangle-list text-emerald-500 mr-3"></i>So‘rovnomalar</button>` : ''}
                                ${hasAdminPerm('admin_turlar') ? `<button onclick="checkAdminPasswordAndSwitch('admin_turlar')" class="w-full text-left px-4 py-2.5 rounded-2xl font-medium text-sm transition flex items-center gap-3 tab-btn" data-tab="admin_turlar"><i class="fa-regular fa-gear text-purple-500 mr-3"></i>Ariza turlari</button>` : ''}
                                ${hasAdminPerm('admin_sorovnoma_turlar') ? `<button onclick="checkAdminPasswordAndSwitch('admin_sorovnoma_turlar')" class="w-full text-left px-4 py-2.5 rounded-2xl font-medium text-sm transition flex items-center gap-3 tab-btn" data-tab="admin_sorovnoma_turlar"><i class="fa-regular fa-list-check text-emerald-500 mr-3"></i>So‘rovnoma turlari</button>` : ''}
                                ${hasAdminPerm('admin_statistika') ? `<button onclick="checkAdminPasswordAndSwitch('admin_statistika')" class="w-full text-left px-4 py-2.5 rounded-2xl font-medium text-sm transition flex items-center gap-3 tab-btn" data-tab="admin_statistika"><i class="fa-regular fa-chart-pie text-purple-500 mr-3"></i>Statistika</button>` : ''}
                                ${hasAdminPerm('admin_holatlar') ? `<button onclick="checkAdminPasswordAndSwitch('admin_holatlar')" class="w-full text-left px-4 py-2.5 rounded-2xl font-medium text-sm transition flex items-center gap-3 tab-btn" data-tab="admin_holatlar"><i class="fa-regular fa-palette text-purple-500 mr-3"></i>Holatlar</button>` : ''}

        window.openImageViewer = function(urls, startIdx = 0) {

            function draw() {
                modal.innerHTML = `
                    <div class="fixed inset-0 bg-black/95 z-[100] flex items-center justify-center p-4 modal-overlay" onclick="if(event.target===this)closeModal()">
                        <button onclick="closeModal()" class="absolute top-4 right-4 text-white text-3xl w-11 h-11 rounded-full bg-white/10 hover:bg-white/20">&times;</button>
                        ${urls.length > 1 ? `<button onclick="event.stopPropagation();window._imgPrev()" class="absolute left-2 md:left-6 text-white text-5xl w-12 h-12 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center">‹</button>` : ''}
                        <img src="${urls[idx]}" class="max-w-full max-h-[88vh] object-contain rounded-2xl shadow-2xl" onclick="event.stopPropagation()">
                        ${urls.length > 1 ? `<button onclick="event.stopPropagation();window._imgNext()" class="absolute right-2 md:right-6 text-white text-5xl w-12 h-12 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center">›</button>` : ''}
                        ${urls.length > 1 ? `<div class="absolute bottom-6 left-1/2 -translate-x-1/2 text-white text-sm bg-black/60 px-4 py-1 rounded-full">${idx+1} / ${urls.length}</div>` : ''}
                    </div>
                `;
            }
            window._imgPrev = () => { idx = (idx - 1 + urls.length) % urls.length; draw(); };
            window._imgNext = () => { idx = (idx + 1) % urls.length; draw(); };

        };

        async function renderUzumMarket(container) {
            const user = await getCurrentUser();
            const mahsulotlar = await getMahsulotlarCached(true);
            const bs = await getBolimSozlamalari();
            const uNomi = bs.uzum?.nomi || 'Uzum Market';
            const uRang = bs.uzum?.rang || '#a855f7';
            let html = `
                <div class="bg-white/70 backdrop-blur-sm p-6 rounded-3xl shadow-sm border border-purple-100 space-y-6">
                    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-3">
                        <div><h2 class="text-2xl font-bold text-gray-800"><i class="fa-solid fa-bag-shopping mr-3" style="color:${uRang}"></i>${uNomi}</h2><p class="text-sm text-gray-500">Mahsulotlarni tanlang va savatga qo'shing</p></div>
                        <div class="w-full md:w-72"><input type="text" id="uzumSearch" placeholder="Nomi yoki ID..." class="w-full px-4 py-3 border-2 border-purple-200 rounded-2xl focus:ring-4 focus:ring-purple-300 bg-white/80"></div>
                    </div>
                    <div id="uzumMahsulotlarGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
                </div>
            `;
            container.innerHTML = html;
            function draw(filter = '') {
                const grid = document.getElementById('uzumMahsulotlarGrid'); if (!grid) return;
                const f = filter.toLowerCase();
                let cards = ''; let found = false;
                for (let mId in mahsulotlar) {
                    const m = mahsulotlar[mId];
                    if (m.korinsin === false) continue;
                    if (f && !(`${m.nomi} ${m.tavsif || ''} ${m.narx || ''} ${mId}`.toLowerCase().includes(f))) continue;
                    found = true;
                    const imgs = getProductImages(m);
                    const rasm = imgs.length
                        ? `<img src="${imgs[0]}" class="w-full h-44 object-contain bg-gray-50 rounded-2xl img-thumb cursor-pointer" onclick="event.stopPropagation();openProductFullScreen('${mId}')">`
                        : `<div class="w-full h-44 bg-gray-100 rounded-2xl flex items-center justify-center text-gray-300"><i class="fa-solid fa-image text-4xl"></i></div>`;
                    const chegirma = m.chegirma ? `<span class="absolute top-2 left-2 bg-red-500 text-white text-xs px-2 py-0.5 rounded-full font-bold">-${m.chegirma}%</span>` : '';
                    const eskiNarx = m.eskiNarx ? `<span class="text-xs text-gray-400 line-through">${m.eskiNarx} so'm</span>` : '';
                    const soni = parseInt(m.soni) || 0;
                    const tugadi = soni <= 0;
                    const ozQoldi = soni > 0 && soni <= 1;
                    let stockHtml = '';
                    if (tugadi) stockHtml = `<span class="text-xs bg-red-100 text-red-700 px-2 py-0.5 rounded-full font-bold">Tugadi</span>`;
                    else if (ozQoldi) stockHtml = `<span class="text-xs bg-orange-100 text-orange-700 px-2 py-0.5 rounded-full font-bold badge-pulse">Oxirgi dona!</span>`;
                    else stockHtml = `<span class="text-xs bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded-full font-bold">${soni} dona</span>`;
                    const btnDisabled = tugadi ? 'disabled opacity-50 cursor-not-allowed' : '';
                    const imgsCount = imgs.length > 1 ? `<span class="absolute top-2 right-2 bg-black/60 text-white text-[10px] px-2 py-0.5 rounded-full"><i class="fa-regular fa-images mr-1"></i>${imgs.length}</span>` : '';
                    cards += `
                        <div class="product-card relative border border-gray-100 rounded-3xl p-4 bg-white shadow-sm space-y-3">
                            ${chegirma}${imgsCount}
                            <div onclick="openProductFullScreen('${mId}')" class="cursor-pointer">${rasm}</div>
                            <div class="space-y-1">
                                <div class="flex items-center justify-between gap-1">
                                    <span class="text-[10px] font-bold text-gray-400">ID: ${mId}</span>
                                    ${stockHtml}
                                </div>
                                <h3 class="font-bold text-gray-800 line-clamp-2 min-h-[2.5rem] cursor-pointer" onclick="openProductFullScreen('${mId}')">${m.nomi}</h3>
                                <p class="text-xs text-gray-500 line-clamp-2">${m.tavsif || ''}</p>
                            </div>
                            <div class="flex items-end justify-between gap-2">
                                <div><div class="text-lg font-extrabold text-purple-700">${m.narx || '0'} so'm</div>${eskiNarx}</div>
                                <div class="flex gap-1">
                                    <button onclick="event.stopPropagation();addToCart('${mId}')" ${btnDisabled} class="bg-gradient-to-r from-amber-500 to-orange-500 text-white px-3 py-2 rounded-2xl text-xs font-bold shadow hover:shadow-lg ${btnDisabled}"><i class="fa-solid fa-cart-plus"></i></button>
                                    <button onclick="event.stopPropagation();openBuyurtmaModal('${mId}')" ${btnDisabled} class="bg-gradient-to-r from-purple-600 to-pink-600 text-white px-3 py-2 rounded-2xl text-xs font-bold shadow hover:shadow-lg ${btnDisabled}"><i class="fa-solid fa-bolt"></i> Buyurtma</button>
                                    <button onclick="event.stopPropagation();openFikrlarModal('${mId}')" class="bg-pink-100 text-pink-700 px-3 py-2 rounded-2xl text-xs font-bold shadow hover:shadow-lg"><i class="fa-regular fa-comment-dots"></i></button>
                                </div>
                            </div>
                        </div>
                    `;
                }
                if (!found) cards = `<div class="col-span-full text-center py-10 text-gray-400">Mahsulotlar topilmadi</div>`;
                grid.innerHTML = cards;
            }
            draw();
            document.getElementById('uzumSearch').addEventListener('input', (e) => draw(e.target.value.trim()));
        }

                                ${imgs.length > 1 ? `<div class="flex gap-2 mt-2 overflow-x-auto pb-1">${imgs.map((u,i) => `<img src="${u}" class="w-14 h-14 object-cover rounded-xl border cursor-pointer hover:border-purple-500 flex-shrink-0" onclick="document.getElementById('mainProductImg').src='${u}'">`).join('')}</div>` : ''}
                            </div>
                            <div class="space-y-2">
                                <div class="flex items-center gap-2">
                                    <span class="text-[10px] font-bold bg-purple-100 text-purple-700 px-2 py-0.5 rounded-full">ID: ${mId}</span>
                                    <span class="text-[10px] bg-gray-200 text-gray-600 px-2 py-0.5 rounded-full">${m.soni || 0} dona</span>
                                </div>
                                <h2 class="text-2xl font-bold text-gray-800">${m.nomi}</h2>

                                <div class="flex items-center gap-3">

                                    ${m.eskiNarx ? `<span class="text-sm text-gray-400 line-through">${m.eskiNarx} so'm</span>` : ''}

        window.submitFikr = async function(mId) {
            const user = await getCurrentUser(); if (!user) { alert("Tizimga kiring!"); return; }
            const matn = document.getElementById('fikrMatn').value.trim();
            const rasmInput = document.getElementById('fikrRasm');
            if (!matn) { alert("Fikr matnini kiriting!"); return; }
            async function readFile(file) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); }); }
            let rasmUrl = '';
            if (rasmInput.files && rasmInput.files[0]) rasmUrl = await readFile(rasmInput.files[0]);
            const fId = 'f_' + Math.floor(10000 + Math.random() * 90000);
            const d = new Date();
            const sana = `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
            await set(ref(db, `fikrlar/${mId}/${fId}`), { id: fId, userId: user.id, matn, rasmUrl, sana, adminJavob: '' });
            CACHE.fikrlar = null;
            alert("Fikringiz qo'shildi!");
            const currentModal = document.querySelector('.modal-overlay');
            if (currentModal && currentModal.parentElement) { closeModal(); openProductFullScreen(mId); }
        };

        window.deleteFikr = async function(mId, fId) {
            if (!confirm("Fikr o'chirilsinmi?")) return;
            await remove(ref(db, `fikrlar/${mId}/${fId}`));
            CACHE.fikrlar = null;
            alert("O'chirildi!");
            const currentModal = document.querySelector('.modal-overlay');
            if (currentModal && currentModal.parentElement) { closeModal(); openProductFullScreen(mId); }
        };

        window.addToCart = async function(mId) {
            const mahsulotlar = await getMahsulotlarCached();
            const m = mahsulotlar[mId]; if (!m) return;
            const soni = parseInt(m.soni) || 0;
            if (soni <= 0) { alert("Mahsulot tugagan!"); return; }
            const cur = parseInt(savat[mId]?.soni) || 0;
            if (cur + 1 > soni) { alert("Omborda yetarli emas!"); return; }
            savat[mId] = { soni: cur + 1, nomi: m.nomi, narx: parseInt(m.narx) || 0, turi: m.turi || 'oddiy', razmer: m.razmer || '', rang: m.rang || '' };
            savatSelected[mId] = true;
            saveSavat(); saveSavatSelected();
            alert(`Savatga qo'shildi: ${m.nomi}`);
        };

            const user = await getCurrentUser(); if (!user) return;
            const mahsulotlar = await getMahsulotlarCached(true);

            container.innerHTML = `
                <div class="bg-white/70 backdrop-blur-sm p-6 rounded-3xl shadow-sm border border-amber-100 space-y-4">

                            <h2 class="text-2xl font-bold text-gray-800"><i class="fa-solid fa-cart-shopping text-amber-500 mr-3"></i>Savat</h2>

                            <button id="selectAllCartBtn" class="text-xs bg-emerald-100 text-emerald-700 px-4 py-2 rounded-2xl font-bold hover:bg-emerald-200 transition"><i class="fa-solid fa-check-double mr-1"></i>Hammasini tanlash</button>
                            <button id="unselectAllCartBtn" class="text-xs bg-gray-100 text-gray-700 px-4 py-2 rounded-2xl font-bold hover:bg-gray-200 transition"><i class="fa-regular fa-circle-xmark mr-1"></i>Bekor qilish</button>
                        </div>
                    </div>
                    <div id="savatList" class="space-y-3"></div>
                    <div id="savatFooter"></div>
                </div>
            `;
            const list = document.getElementById('savatList');
            const footer = document.getElementById('savatFooter');

            function draw() {
                let html = '';
                let jamiSelected = 0, countSelected = 0, jamiAll = 0, countAll = 0;

                for (let mId in savat) {
                    const it = savat[mId]; const m = mahsulotlar[mId]; if (!m) continue;
                    const sum = (it.narx || 0) * (it.soni || 0);
                    jamiAll += sum; countAll += it.soni || 0;
                    const isChecked = !!savatSelected[mId];
                    if (isChecked) { jamiSelected += sum; countSelected += it.soni || 0; }

                    const imgs = getProductImages(m);
                    const rasm = imgs.length ? `<img src="${imgs[0]}" class="w-20 h-20 object-contain bg-gray-50 rounded-xl border img-thumb" onclick="openImageViewer(${JSON.stringify(imgs).replace(/"/g,'&quot;')},0)">` : `<div class="w-20 h-20 bg-gray-100 rounded-xl flex items-center justify-center"><i class="fa-solid fa-image text-gray-300"></i></div>`;
                    const maxSoni = parseInt(m.soni) || 0;

                    html += `
                        <div class="border-2 ${isChecked ? 'cart-selected' : 'border-gray-200'} p-4 rounded-3xl bg-white shadow-sm flex flex-col md:flex-row gap-3 items-start md:items-center transition">
                            <label class="flex items-center cursor-pointer flex-shrink-0 pt-1 md:pt-0">
                                <input type="checkbox" ${isChecked ? 'checked' : ''} onchange="toggleCartSelection('${mId}')" class="w-6 h-6 accent-emerald-600 cursor-pointer">
                            </label>
                            ${rasm}
                            <div class="flex-1 space-y-1">
                                <h3 class="font-bold text-gray-800">${m.nomi}</h3>
                                <p class="text-xs text-gray-500">ID: ${mId} · Omborda: ${maxSoni} dona</p>
                                <p class="text-sm font-extrabold text-purple-700">${it.narx.toLocaleString()} so'm × ${it.soni}</p>
                                <p class="text-xs text-gray-600">Jami: <b>${sum.toLocaleString()} so'm</b></p>
                            </div>
                            <div class="flex items-center gap-2">
                                <button onclick="changeCartQty('${mId}',-1)" class="bg-gray-100 text-gray-700 w-9 h-9 rounded-full font-bold hover:bg-gray-200">−</button>
                                <span class="w-8 text-center font-bold">${it.soni}</span>
                                <button onclick="changeCartQty('${mId}',1)" class="bg-gray-100 text-gray-700 w-9 h-9 rounded-full font-bold hover:bg-gray-200">+</button>
                                <button onclick="removeFromCart('${mId}')" class="bg-red-50 text-red-600 px-3 py-2 rounded-2xl font-bold text-xs hover:bg-red-100 ml-2"><i class="fa-regular fa-trash"></i></button>
                            </div>
                        </div>
                    `;
                }
                list.innerHTML = html || `<div class="text-center py-10 text-gray-400">Savat bo'sh</div>`;

                footer.innerHTML = countAll > 0 ? `
                    <div class="border-t pt-4 space-y-3">
                        <div class="flex flex-wrap justify-between items-center gap-2 text-sm">
                            <div>Tanlangan: <b class="text-emerald-700">${countSelected} dona</b></div>
                            <div>Tanlangan summa: <b class="text-emerald-700 text-lg">${jamiSelected.toLocaleString()} so'm</b></div>
                        </div>
                        ${countSelected > 0
                            ? `<button id="savatCheckoutBtn" class="w-full bg-gradient-to-r from-emerald-600 to-teal-600 text-white px-8 py-3.5 rounded-2xl font-bold shadow hover:shadow-lg"><i class="fa-solid fa-credit-card mr-2"></i>Tanlanganlarni buyurtma qilish (${countSelected} dona)</button>`
                            : `<button disabled class="w-full bg-gray-200 text-gray-400 px-8 py-3.5 rounded-2xl font-bold cursor-not-allowed"><i class="fa-solid fa-hand-pointer mr-2"></i>Avval mahsulotlarni belgilang ☑️</button>`}
                        <div class="text-center text-xs text-gray-400">Butun savat: ${jamiAll.toLocaleString()} so'm (${countAll} dona)</div>
                    </div>
                ` : '';
                document.getElementById('savatCheckoutBtn')?.addEventListener('click', () => openCheckoutModal());
            }
            draw();

            document.getElementById('selectAllCartBtn').addEventListener('click', () => {
                for (let mId in savat) savatSelected[mId] = true;
                saveSavatSelected(); renderSavat(container);
            });
            document.getElementById('unselectAllCartBtn').addEventListener('click', () => {
                savatSelected = {}; saveSavatSelected(); renderSavat(container);
            });
        }

        window.toggleCartSelection = function(mId) {
            if (savatSelected[mId]) delete savatSelected[mId];
            else savatSelected[mId] = true;
            saveSavatSelected();
            renderSavat(document.getElementById('tabContent'));
        };

        window.changeCartQty = async function(mId, delta) {
            const mahsulotlar = await getMahsulotlarCached();
            const m = mahsulotlar[mId]; if (!m || !savat[mId]) return;
            const maxSoni = parseInt(m.soni) || 0;
            const newSoni = (savat[mId].soni || 0) + delta;
            if (newSoni <= 0) { delete savat[mId]; delete savatSelected[mId]; }
            else if (newSoni > maxSoni) { alert("Omborda yetarli emas!"); return; }
            else { savat[mId].soni = newSoni; }
            saveSavat(); saveSavatSelected(); renderSavat(document.getElementById('tabContent'));
        };
        window.removeFromCart = function(mId) {
            delete savat[mId];
            delete savatSelected[mId];
            saveSavat(); saveSavatSelected();
            renderSavat(document.getElementById('tabContent'));
        };

        // ============= CHECKOUT =============
        window.openCheckoutModal = async function() {
            const user = await getCurrentUser(); if (!user) return;
            const selectedIds = Object.keys(savatSelected).filter(id => savat[id]);
            if (!selectedIds.length) { alert("Avval mahsulotlarni belgilang! ☑️"); return; }
            const mahsulotlar = await getMahsulotlarCached();
            const maydonlar = await getBuyurtmaMaydonlar(true);
            const modal = document.getElementById('modalContainer');

            let fieldsHtml = '';
            const entries = sortMaydonlar(maydonlar);
            if (entries.length === 0) {
                fieldsHtml = `
                    <div><label class="block text-xs font-bold text-gray-700 uppercase mb-1">Telefon *</label><input type="tel" id="co_tel" value="" class="co-field w-full border-2 border-purple-200 px-4 py-3 rounded-2xl" data-fid="tel" data-ftype="tel" data-req="true"></div>
                    <div><label class="block text-xs font-bold text-gray-700 uppercase mb-1">Yetkazib berish manzili *</label><textarea id="co_manzil" rows="2" class="co-field w-full border-2 border-purple-200 px-4 py-3 rounded-2xl" data-fid="manzil" data-ftype="manzil" data-req="true"></textarea></div>
                    <div><label class="block text-xs font-bold text-gray-700 uppercase mb-1">Izoh</label><textarea id="co_izoh" rows="2" class="co-field w-full border-2 border-purple-200 px-4 py-3 rounded-2xl" data-fid="izoh" data-ftype="izoh" data-req="false"></textarea></div>
                `;
            } else {
                for (let [mId, m] of entries) {
                    const req = m.majburiy !== false;
                    fieldsHtml += `<div class="space-y-1"><label class="block text-xs font-bold text-gray-700 uppercase mb-1">${m.nomi} ${req ? '<span class="text-red-500">*</span>' : '<span class="text-gray-400 text-xs">(ixtiyoriy)</span>'}</label>`;
                    if (m.turi === 'matn') fieldsHtml += `<input type="text" data-fid="${mId}" data-ftype="matn" data-req="${req}" class="co-field w-full border-2 border-purple-200 px-4 py-3 rounded-2xl" placeholder="${m.placeholder || ''}">`;
                    else if (m.turi === 'nomer' || m.turi === 'tel') fieldsHtml += `<input type="tel" data-fid="${mId}" data-ftype="${m.turi}" data-req="${req}" class="co-field w-full border-2 border-purple-200 px-4 py-3 rounded-2xl" placeholder="${m.placeholder || '+998 ...'}">`;
                    else if (m.turi === 'manzil' || m.turi === 'izoh') fieldsHtml += `<textarea data-fid="${mId}" data-ftype="${m.turi}" data-req="${req}" rows="2" class="co-field w-full border-2 border-purple-200 px-4 py-3 rounded-2xl" placeholder="${m.placeholder || ''}"></textarea>`;
                    else if (m.turi === 'tanlov') {
                        const vars = (m.variantlar || '').split(',').map(v => v.trim()).filter(Boolean);
                        fieldsHtml += `<select data-fid="${mId}" data-ftype="tanlov" data-req="${req}" class="co-field w-full border-2 border-purple-200 px-4 py-3 rounded-2xl bg-white"><option value="">-- Tanlang --</option>${vars.map(v => `<option value="${v}">${v}</option>`).join('')}</select>`;
                    } else if (m.turi === 'sana') fieldsHtml += `<input type="date" data-fid="${mId}" data-ftype="sana" data-req="${req}" class="co-field w-full border-2 border-purple-200 px-4 py-3 rounded-2xl">`;
                    else if (m.turi === 'vaqt') fieldsHtml += `<input type="time" data-fid="${mId}" data-ftype="vaqt" data-req="${req}" class="co-field w-full border-2 border-purple-200 px-4 py-3 rounded-2xl">`;
                    else fieldsHtml += `<input type="text" data-fid="${mId}" data-ftype="matn" data-req="${req}" class="co-field w-full border-2 border-purple-200 px-4 py-3 rounded-2xl">`;
                    fieldsHtml += `</div>`;
                }
            }
            let itemsHtml = ''; let jami = 0;
            for (let mId of selectedIds) {
                const it = savat[mId]; const m = mahsulotlar[mId]; if (!m) continue;
                const sum = it.narx * it.soni; jami += sum;
                itemsHtml += `<div class="flex justify-between items-center border-b py-2 text-sm"><span>${m.nomi} <b>×${it.soni}</b></span><span class="font-bold">${sum.toLocaleString()} so'm</span></div>`;
            }
            modal.innerHTML = `
                <div class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 overflow-y-auto modal-overlay">

        async function submitCheckout(selectedIds) {
            const user = await getCurrentUser(); if (!user) return;
            if (!selectedIds || !selectedIds.length) { alert("Mahsulot tanlanmagan!"); return; }
            const mahsulotlar = await getMahsulotlarCached(true);
            for (let mId of selectedIds) {
                const m = mahsulotlar[mId]; if (!m) { alert(`Mahsulot o'chirilgan: ${mId}`); return; }
                if ((parseInt(m.soni) || 0) < savat[mId].soni) { alert(`Omborda yetarli emas: ${m.nomi}`); return; }
            }
            const inputs = document.querySelectorAll('.co-field');
            let data = {}; let tel = '', manzil = '', izoh = '';
            for (let inp of inputs) {
                const fid = inp.dataset.fid, ftype = inp.dataset.ftype, req = inp.dataset.req === 'true';
                const v = (inp.value || '').trim();
                if (req && !v) { alert(`Majburiy maydon: ${fid}`); inp.focus(); return; }
                data[fid] = { turi: ftype, qiymat: v };
                if (fid === 'tel' || ftype === 'tel') tel = v;
                if (fid === 'manzil' || ftype === 'manzil') manzil = v;
                if (fid === 'izoh' || ftype === 'izoh') izoh = v;
            }
            const hSnap = await get(ref(db, 'holatlar')); const holatlar = hSnap.exists() ? hSnap.val() : {};
            let defHolat = 'Yangi', defRangi = 'background:#dbeafe;color:#1e40af;';
            const firstH = Object.keys(holatlar)[0]; if (firstH) { defHolat = holatlar[firstH].yozuv; defRangi = holatlar[firstH].rang; }

            const raqam = Math.floor(100000 + Math.random() * 900000).toString();
            const kod5 = await generateKod5();
            const shtrixKod = 'UZ' + Date.now().toString().slice(-8) + Math.floor(10 + Math.random()*90);

            let items = []; let jami = 0; let birinchiRasm = '';
            for (let mId of selectedIds) {
                const it = savat[mId]; const m = mahsulotlar[mId];
                const imgs = getProductImages(m);
                items.push({ mahsulotId: mId, mahsulotNomi: m.nomi, mahsulotRasm: imgs[0] || '', soni: it.soni, narx: it.narx, jami: it.narx * it.soni, turi: m.turi || 'oddiy', razmer: m.razmer || '', rang: m.rang || '' });
                jami += it.narx * it.soni;
                if (!birinchiRasm && imgs[0]) birinchiRasm = imgs[0];
                await update(ref(db, `mahsulotlar/${mId}`), { soni: (parseInt(m.soni) || 0) - it.soni });
            }

            const yeni = {
                id: raqam, userId: user.id, userRole: user.role,
                items, jami, tel, manzil, izoh, qiymatlar: data,
                mahsulotNomi: items.map(i => i.mahsulotNomi).join(', '),
                mahsulotRasm: birinchiRasm,
                sana: new Date().toISOString(),
                holat: defHolat, holatRangi: defRangi,
                javob: '', korinsin: true,
                kod5, shtrixKod
            };
            await set(ref(db, `buyurtmalar/${raqam}`), yeni);
            CACHE.buyurtmalar = null; CACHE.mahsulotlar = null;

            for (let mId of selectedIds) { delete savat[mId]; delete savatSelected[mId]; }
            saveSavat(); saveSavatSelected(); closeModal();
            renderBuyurtmaTabrik(document.getElementById('tabContent'), yeni);
        }

        async function generateKod5() {
            for (let i = 0; i < 30; i++) {
                const code = Math.floor(10000 + Math.random() * 90000).toString();
                const s = await get(ref(db, `kodlar/${code}`));
                if (!s.exists()) { await set(ref(db, `kodlar/${code}`), true); return code; }
            }
            return Date.now().toString().slice(-5);
        }

                    for (let hKey in holatlar) { if (holatlar[hKey].yozuv === b.holat) { holatData = holatlar[hKey]; break; } }

                    const showKod5 = holatData ? holatData.kod5Korsatish !== false : true;
                    const showRasm = holatData ? holatData.rasmKorsatish !== false : true;
                    const canEdit = holatData ? holatData.tahrirlashRuxsati !== false : true;

                                <span class="font-bold">Umumiy jami:</span>
                                <span class="font-extrabold text-purple-700 text-lg">${(b.jami || 0).toLocaleString()} so'm</span>

        window.userDeleteBuyurtma = async function(id) {
            const user = await getCurrentUser();
            const all = await getBuyurtmalarCached(true);
            const b0 = all[id];
            if (b0) {
                const holatlar = await getHolatlarCached(true);
                let holatData = null;
                for (let hKey in holatlar) { if (holatlar[hKey].yozuv === b0.holat) { holatData = holatlar[hKey]; break; } }
                const canDelete = holatData ? holatData.ochirishRuxsati !== false : true;
                if (!canDelete && user.role !== 'admin') { alert("Bu holatda o'chirish mumkin emas!"); return; }
            }
            if (!confirm("O'chirilsin?")) return;
            const bSnap = await get(ref(db, `buyurtmalar/${id}`));
            const b = bSnap.exists() ? bSnap.val() : null;
            if (b && b.items && b.items.length) {
                for (let it of b.items) {
                    if (!it.mahsulotId) continue;
                    const mSnap = await get(ref(db, `mahsulotlar/${it.mahsulotId}`));
                    if (mSnap.exists()) { const m = mSnap.val(); await update(ref(db, `mahsulotlar/${it.mahsulotId}`), { soni: (parseInt(m.soni) || 0) + it.soni }); }
                }
            }
            await remove(ref(db, `buyurtmalar/${id}`));
            CACHE.buyurtmalar = null; CACHE.mahsulotlar = null;
            renderBuyurtmalarim(document.getElementById('tabContent'));
        };

        // ==================== YANGI: SHTRIX KOD VA 5 XONALI KODNI TAHRIRLASH/QAYTA YARATISH/O'CHIRISH ====================
        window.regenerateShtrixKod = async function(type, id) {

            const path = type === 'buyurtma' ? `buyurtmalar/${id}` : `arizalar/${id}`;
            await update(ref(db, path), { shtrixKod: newCode });
            if (type === 'buyurtma') CACHE.buyurtmalar = null; else CACHE.arizalar = null;
            alert("Yangi shtrix kod: " + newCode);

            if (type === 'buyurtma') CACHE.buyurtmalar = null; else CACHE.arizalar = null;

        window.deleteKod5 = async function(type, id) {

            if (type === 'buyurtma') renderBuyurtmalarim(document.getElementById('tabContent'));
            else renderArizalarim(document.getElementById('tabContent'));

        };

        // ==================== TAHRIRLASH MODAL: BUYURTMA ====================
        window.openUserEditBuyurtmaModal = async function(bId) {
            const user = await getCurrentUser();
            const all = await getBuyurtmalarCached(true);
            const b = all[bId]; if (!b) return;
            const isAdmin = user.role === 'admin';
            const holatlar = await getHolatlarCached(true);
            let holatData = null;
            for (let hKey in holatlar) { if (holatlar[hKey].yozuv === b.holat) { holatData = holatlar[hKey]; break; } }
            const canEdit = holatData ? holatData.tahrirlashRuxsati !== false : true;
            const showKod5 = holatData ? holatData.kod5Korsatish !== false : true;
            const showShtrix = holatData ? holatData.shtrixKorsatish !== false : true;
            const canEditProducts = holatData ? holatData.mahsulotTahrirlash === true : false;

            if (!canEdit && !isAdmin) { alert("Bu holatda tahrirlash mumkin emas!"); return; }
            if (!isAdmin && b.userId !== user.id) { alert("Huquq yo'q"); return; }

            const mahsulotlar = await getMahsulotlarCached(true);
            let editItems = JSON.parse(JSON.stringify(b.items || [{ mahsulotId: '', mahsulotNomi: b.mahsulotNomi, soni: b.soni, narx: b.narx, jami: b.jami }]));
            const modal = document.getElementById('modalContainer');

            function calcJami() { return editItems.reduce((s, it) => s + ((parseInt(it.narx) || 0) * (parseInt(it.soni) || 0)), 0); }
            function itemsHtml() {
                return editItems.map((it, idx) => `
                    <div class="border-2 border-gray-200 p-3 rounded-2xl space-y-2 bg-gray-50">
                        <div class="flex justify-between items-center gap-2">
                            <input type="text" class="flex-1 border-2 readonly-field px-3 py-2 rounded-xl text-sm" value="${it.mahsulotNomi || ''}" readonly>
                            ${canEditProducts ? `<button onclick="window._uebRemoveItem(${idx})" class="bg-red-50 text-red-600 px-3 py-1.5 rounded-xl text-xs font-bold hover:bg-red-100"><i class="fa-regular fa-trash"></i></button>` : ''}
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <input type="number" class="w-full border-2 readonly-field px-3 py-2 rounded-xl text-sm" value="${it.soni || 1}" readonly>
                            <input type="number" class="w-full border-2 readonly-field px-3 py-2 rounded-xl text-sm" value="${it.narx || 0}" readonly>
                        </div>
                    </div>
                `).join('') || '<p class="text-xs text-gray-400 text-center py-2">Mahsulotlar yo\'q</p>';
            }
            function productsSelectHtml() {
                let opts = '<option value="">-- Mahsulot tanlang --</option>';
                for (let mId in mahsulotlar) {
                    const m = mahsulotlar[mId];
                    const mSoni = parseInt(m.soni) || 0;
                    if (mSoni <= 0) continue;
                    opts += `<option value="${mId}">${m.nomi} — ${m.narx} so'm (${mSoni} dona)</option>`;
                }
                return opts;
            }
            function refreshUebUI() {
                const listEl = document.getElementById('uebItemsList');
                if (listEl) listEl.innerHTML = itemsHtml();
                const jamiEl = document.getElementById('uebJami');
                if (jamiEl) jamiEl.textContent = calcJami().toLocaleString() + " so'm";
            }
            window._uebRemoveItem = function(idx) { editItems.splice(idx, 1); refreshUebUI(); };

            const adminOnlyKodControls = isAdmin ? `
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3 bg-amber-50 p-3 rounded-2xl border-2 border-amber-300">
                    <div>
                        <label class="text-[10px] font-bold uppercase text-amber-700">5 xonali kod ${showKod5 ? '' : '<span class="text-red-500">(yashirilgan)</span>'}</label>
                        <input type="text" id="uebKod5Input" value="${b.kod5 || ''}" class="w-full border-2 border-amber-300 px-3 py-2 rounded-xl font-bold tracking-widest bg-white">
                        <div class="flex gap-1 mt-1 flex-wrap">
                            <button onclick="saveUebKod5('${bId}')" class="bg-emerald-600 text-white px-2 py-1 rounded-lg text-[10px] font-bold">💾 Saqlash</button>
                            <button onclick="regenerateKod5('buyurtma','${bId}')" class="bg-blue-600 text-white px-2 py-1 rounded-lg text-[10px] font-bold">🔄 Qayta</button>
                            <button onclick="deleteKod5('buyurtma','${bId}')" class="bg-red-600 text-white px-2 py-1 rounded-lg text-[10px] font-bold">🗑 O'chirish</button>
                        </div>
                    </div>
                    <div>
                        <label class="text-[10px] font-bold uppercase text-amber-700">Shtrix kod ${showShtrix ? '' : '<span class="text-red-500">(yashirilgan)</span>'}</label>
                        <input type="text" id="uebShtrixInput" value="${b.shtrixKod || ''}" class="w-full border-2 border-amber-300 px-3 py-2 rounded-xl text-xs bg-white">
                        <div class="flex gap-1 mt-1 flex-wrap">
                            <button onclick="saveUebShtrix('${bId}')" class="bg-emerald-600 text-white px-2 py-1 rounded-lg text-[10px] font-bold">💾 Saqlash</button>
                            <button onclick="regenerateShtrixKod('buyurtma','${bId}')" class="bg-blue-600 text-white px-2 py-1 rounded-lg text-[10px] font-bold">🔄 Qayta</button>
                            <button onclick="deleteShtrixKod('buyurtma','${bId}')" class="bg-red-600 text-white px-2 py-1 rounded-lg text-[10px] font-bold">🗑 O'chirish</button>
                        </div>
                    </div>
                    <div class="md:col-span-2 text-[10px] text-gray-500 italic"><i class="fa-solid fa-shield-halved mr-1"></i>Faqat admin shtrix va 5 xonali kodni o'zgartira oladi.</div>
                </div>
            ` : `
                ${(showKod5 || showShtrix) ? `
                <div class="grid grid-cols-2 gap-2 bg-amber-50 p-3 rounded-2xl border border-amber-200">
                    ${showKod5 ? `<div><label class="text-[10px] font-bold uppercase text-amber-700">5 xonali kod</label><input type="text" value="${b.kod5 || ''}" class="w-full border-2 readonly-field px-3 py-2 rounded-xl font-bold tracking-widest" readonly></div>` : ''}
                    ${showShtrix ? `<div><label class="text-[10px] font-bold uppercase text-amber-700">Shtrix kod</label><input type="text" value="${b.shtrixKod || ''}" class="w-full border-2 readonly-field px-3 py-2 rounded-xl text-xs" readonly></div>` : ''}
                </div>
                <p class="text-[10px] text-gray-500 italic -mt-2"><i class="fa-regular fa-lock mr-1"></i>Faqat admin o'zgartirishi mumkin.</p>
                ` : ''}
            `;

            modal.innerHTML = `
                <div class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 overflow-y-auto modal-overlay">
                    <div class="bg-white p-6 md:p-8 rounded-3xl shadow-2xl w-full max-w-lg space-y-4 max-h-[90vh] overflow-y-auto border border-purple-100">
                        <div class="flex justify-between items-center border-b pb-3"><h3 class="text-2xl font-bold text-gray-800">Buyurtmani tahrirlash №${b.id}</h3><button onclick="closeModal()" class="text-gray-400 hover:text-gray-700 text-2xl font-bold px-2">&times;</button></div>

                        ${adminOnlyKodControls}

                        <div>
                            <h4 class="text-xs font-bold text-gray-600 uppercase mb-2">Mahsulotlar ${canEditProducts ? '<span class="text-emerald-600">(tahrirlash mumkin)</span>' : '(o\'zgartirilmaydi)'}</h4>
                            <div id="uebItemsList" class="space-y-2">${itemsHtml()}</div>
                        </div>

                        ${canEditProducts ? `
                        <div class="bg-emerald-50 p-3 rounded-2xl border border-emerald-200 space-y-2">
                            <h5 class="text-xs font-bold text-emerald-800 uppercase"><i class="fa-solid fa-plus mr-1"></i>Yangi mahsulot qo'shish</h5>
                            <select id="uebNewProduct" class="w-full border-2 border-emerald-200 px-3 py-2 rounded-xl text-sm bg-white">${productsSelectHtml()}</select>
                            <div class="flex gap-2">
                                <input type="number" id="uebNewProductQty" value="1" min="1" class="w-24 border-2 border-emerald-200 px-3 py-2 rounded-xl text-sm">
                                <button onclick="window._uebAddProduct()" class="flex-1 bg-emerald-600 text-white px-4 py-2 rounded-xl font-bold text-xs hover:bg-emerald-700">Qo'shish</button>
                            </div>
                        </div>
                        ` : ''}

                        <div class="bg-purple-50 p-3 rounded-2xl text-sm flex justify-between items-center font-bold">
                            <span>Umumiy:</span>
                            <span id="uebJami" class="text-purple-700 text-lg">${calcJami().toLocaleString()} so'm</span>
                        </div>

                        <div><label class="block text-xs font-bold text-gray-700 uppercase mb-1">Telefon</label><input type="tel" id="uebTel" value="${b.tel || ''}" class="w-full border-2 border-purple-200 px-4 py-3 rounded-2xl" ${!canEdit && !isAdmin ? 'disabled' : ''}></div>
                        <div><label class="block text-xs font-bold text-gray-700 uppercase mb-1">Manzil</label><textarea id="uebManzil" rows="2" class="w-full border-2 border-purple-200 px-4 py-3 rounded-2xl" ${!canEdit && !isAdmin ? 'disabled' : ''}>${b.manzil || ''}</textarea></div>
                        <div><label class="block text-xs font-bold text-gray-700 uppercase mb-1">Izoh</label><textarea id="uebIzoh" rows="2" class="w-full border-2 border-purple-200 px-4 py-3 rounded-2xl" ${!canEdit && !isAdmin ? 'disabled' : ''}>${b.izoh || ''}</textarea></div>

                        <div class="flex justify-end gap-3 pt-3 border-t">
                            <button onclick="closeModal()" class="px-5 py-2.5 bg-gray-100 text-gray-700 rounded-2xl font-bold text-sm">Yopish</button>
                            ${(canEdit || isAdmin) ? `<button id="uebSave" class="px-6 py-2.5 bg-gradient-to-r from-purple-600 to-pink-600 text-white rounded-2xl font-bold text-sm shadow hover:shadow-lg">Saqlash</button>` : ''}
                        </div>
                    </div>
                </div>
            `;

            window.saveUebKod5 = async function(id) {
                const val = document.getElementById('uebKod5Input').value.trim();
                if (!/^\d{5}$/.test(val)) { alert("5 xonali raqam kiriting!"); return; }
                await update(ref(db, `buyurtmalar/${id}`), { kod5: val });
                CACHE.buyurtmalar = null; alert("5 xonali kod saqlandi!");
            };
            window.saveUebShtrix = async function(id) {
                const val = document.getElementById('uebShtrixInput').value.trim();
                if (!val) { alert("Shtrix kod kiriting!"); return; }
                await update(ref(db, `buyurtmalar/${id}`), { shtrixKod: val });
                CACHE.buyurtmalar = null; alert("Shtrix kod saqlandi!");
            };

            window._uebAddProduct = function() {
                const mId = document.getElementById('uebNewProduct').value;
                if (!mId) { alert("Mahsulot tanlang!"); return; }
                const qty = parseInt(document.getElementById('uebNewProductQty').value) || 1;
                if (qty < 1) { alert("Soni 1 dan katta bo'lishi kerak!"); return; }
                const m = mahsulotlar[mId];
                if (!m) return;
                const maxSoni = parseInt(m.soni) || 0;
                const existingIdx = editItems.findIndex(it => it.mahsulotId === mId);
                if (existingIdx >= 0) {
                    const newQty = (parseInt(editItems[existingIdx].soni) || 0) + qty;
                    if (newQty > maxSoni) { alert(`Omborda yetarli emas! (mavjud: ${maxSoni})`); return; }
                    editItems[existingIdx].soni = newQty;
                    editItems[existingIdx].jami = (parseInt(editItems[existingIdx].narx) || 0) * newQty;
                } else {
                    if (qty > maxSoni) { alert(`Omborda yetarli emas! (mavjud: ${maxSoni})`); return; }
                    const imgs = getProductImages(m);
                    editItems.push({
                        mahsulotId: mId,
                        mahsulotNomi: m.nomi,
                        mahsulotRasm: imgs[0] || '',
                        soni: qty,
                        narx: parseInt(m.narx) || 0,
                        jami: (parseInt(m.narx) || 0) * qty,
                        turi: m.turi || 'oddiy',
                        razmer: m.razmer || '',
                        rang: m.rang || ''
                    });
                }
                document.getElementById('uebNewProductQty').value = 1;
                refreshUebUI();
            };

            document.getElementById('uebSave')?.addEventListener('click', async () => {
                const updateData = {
                    tel: document.getElementById('uebTel').value.trim(),
                    manzil: document.getElementById('uebManzil').value.trim(),
                    izoh: document.getElementById('uebIzoh').value.trim()
                };

                if (canEditProducts) {
                    if (editItems.length === 0) { alert("Kamida bitta mahsulot bo'lishi kerak!"); return; }
                    const oldItems = b.items || [];
                    const oldMap = {};
                    oldItems.forEach(it => { if (it.mahsulotId) oldMap[it.mahsulotId] = (oldMap[it.mahsulotId] || 0) + (parseInt(it.soni) || 0); });
                    const newMap = {};
                    editItems.forEach(it => { if (it.mahsulotId) newMap[it.mahsulotId] = (newMap[it.mahsulotId] || 0) + (parseInt(it.soni) || 0); });
                    const allM = await getMahsulotlarCached(true);
                    for (let mId in newMap) {
                        const oldQty = oldMap[mId] || 0;
                        const newQty = newMap[mId];
                        if (newQty > oldQty) {
                            const m = allM[mId];
                            if (!m) { alert(`Mahsulot topilmadi: ${mId}`); return; }
                            const available = (parseInt(m.soni) || 0) + oldQty;
                            if (newQty > available) { alert(`Omborda yetarli emas: ${m.nomi || mId} (mavjud: ${available}, kerak: ${newQty})`); return; }
                        }
                    }
                    for (let mId in oldMap) {
                        if (!newMap[mId]) {
                            const mSnap = await get(ref(db, `mahsulotlar/${mId}`));
                            if (mSnap.exists()) {
                                const m = mSnap.val();
                                await update(ref(db, `mahsulotlar/${mId}`), { soni: (parseInt(m.soni) || 0) + oldMap[mId] });
                            }
                        }
                    }
                    for (let mId in newMap) {
                        const oldQty = oldMap[mId] || 0;
                        const newQty = newMap[mId];
                        if (newQty !== oldQty) {
                            const mSnap = await get(ref(db, `mahsulotlar/${mId}`));
                            if (mSnap.exists()) {
                                const m = mSnap.val();
                                const diff = newQty - oldQty;
                                await update(ref(db, `mahsulotlar/${mId}`), { soni: (parseInt(m.soni) || 0) - diff });
                            }
                        }
                    }
                    const jami = editItems.reduce((s, it) => s + ((parseInt(it.narx) || 0) * (parseInt(it.soni) || 0)), 0);
                    updateData.items = editItems;
                    updateData.jami = jami;
                    updateData.mahsulotNomi = editItems.map(i => i.mahsulotNomi).join(', ');
                    updateData.mahsulotRasm = editItems[0]?.mahsulotRasm || '';
                    CACHE.mahsulotlar = null;
                }

                await update(ref(db, `buyurtmalar/${bId}`), updateData);
                CACHE.buyurtmalar = null; closeModal();
                if (isAdmin) renderAdminBuyurtmalar(document.getElementById('tabContent'));
                else renderBuyurtmalarim(document.getElementById('tabContent'));
            });
        };

        // ==================== ADMIN: MAHSULOTLAR ====================

                            <button onclick="deleteMahsulot('${mId}')" class="text-red-600 bg-red-50 px-3 py-1.5 rounded-2xl font-bold text-xs"><i class="fa-regular fa-trash"></i></button>

        async function renderAdminBuyurtmalar(container) {
            const buyurtmalar = await getBuyurtmalarCached(true);
            const holatlar = await getHolatlarCached(true);
            container.innerHTML = `
                <div class="bg-white/70 backdrop-blur-sm p-6 rounded-3xl shadow-sm border border-purple-100 space-y-4">
                    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-3"><div><h2 class="text-2xl font-bold text-gray-800"><i class="fa-solid fa-truck-fast text-purple-500 mr-3"></i>Buyurtmalar boshqaruvi</h2><p class="text-sm text-gray-500">Barcha buyurtmalarni boshqarish</p></div><div class="w-full md:w-72"><input type="text" id="adminBuyurtmaSearch" placeholder="Kod / ID / nomi..." class="w-full px-4 py-3 border-2 border-purple-200 rounded-2xl focus:ring-4 focus:ring-purple-300 bg-white/80"></div></div>
                    <div id="adminBuyurtmalarListContainer" class="space-y-4"></div>
                </div>
            `;
            function draw(filter = '') {
                const list = document.getElementById('adminBuyurtmalarListContainer'); if (!list) return;
                const f = filter.toLowerCase();
                let html = ''; let found = false;
                for (let id in buyurtmalar) {
                    const b = buyurtmalar[id]; if (!b.korinsin) continue;
                    const searchText = `${b.id} ${b.kod5 || ''} ${b.shtrixKod || ''} ${b.userId} ${b.mahsulotNomi} ${b.holat} ${b.tel} ${b.manzil}`;
                    if (f && !searchText.toLowerCase().includes(f)) continue;
                    found = true;

                    let holatData = null;
                    for (let hKey in holatlar) { if (holatlar[hKey].yozuv === b.holat) { holatData = holatlar[hKey]; break; } }
                    const showShtrix = holatData ? holatData.shtrixKorsatish !== false : true;
                    const showKod5 = holatData ? holatData.kod5Korsatish !== false : true;
                    const showRasm = holatData ? holatData.rasmKorsatish !== false : true;
                    const canEdit = holatData ? holatData.tahrirlashRuxsati !== false : true;
                    const canDelete = holatData ? holatData.ochirishRuxsati !== false : true;
                    const eslatma = holatData ? holatData.eslatma : '';

                    let holatOptions = ''; for (let hKey in holatlar) { const h = holatlar[hKey]; holatOptions += `<option value="${h.yozuv}" ${b.holat === h.yozuv ? 'selected' : ''}>${h.yozuv}</option>`; }

                    let shtrixHtml = showShtrix ? `<div class="flex-1 min-w-[150px]"><svg class="acv" data-code="${b.shtrixKod || b.id}"></svg></div>` : '';

                    let itemsListHtml = '';
                    const items = b.items || [{ mahsulotNomi: b.mahsulotNomi, soni: b.soni, narx: b.narx, jami: b.jami, mahsulotRasm: b.mahsulotRasm }];
                    itemsListHtml = `

                                </div>

                        </div>

                    html += `

                                <div class="flex items-center gap-2 flex-wrap">
                                    <select onchange="adminUpdateBuyurtmaHolat('${id}', this.value)" class="border-2 border-purple-200 px-3 py-1.5 rounded-2xl text-xs font-bold bg-white">${holatOptions}</select>

                        </div>
                    `;

                if (!found) html = `<div class="text-center py-10 text-gray-400">Buyurtmalar yo‘q</div>`;
                list.innerHTML = html;
                document.querySelectorAll('svg.acv').forEach(svg => { try { JsBarcode(svg, svg.dataset.code, { format: "CODE128", width: 1.2, height: 44, fontSize: 10 }); } catch(e) {} });
            }
            draw();
            document.getElementById('adminBuyurtmaSearch').addEventListener('input', (e) => draw(e.target.value.trim()));

        window.adminUpdateBuyurtmaHolat = async function(id, val) {
            const hSnap = await get(ref(db, 'holatlar')); const holatlar = hSnap.exists() ? hSnap.val() : {};
            let rang = 'background:#f3f4f6;color:#1f2937;';
            for (let hKey in holatlar) { if (holatlar[hKey].yozuv === val) { rang = holatlar[hKey].rang; break; } }
            await update(ref(db, `buyurtmalar/${id}`), { holat: val, holatRangi: rang });
            CACHE.buyurtmalar = null;
        };
        window.saveAdminBuyurtmaJavob = async function(id) {
            const val = document.getElementById(`adminBuyurtmaJavob_${id}`).value.trim();
            await update(ref(db, `buyurtmalar/${id}`), { javob: val });
            CACHE.buyurtmalar = null; alert("Javob saqlandi!");
        };
        window.adminDeleteBuyurtma = async function(id) {
            if (!confirm("O'chirilsin?")) return;
            const bSnap = await get(ref(db, `buyurtmalar/${id}`));
            const b = bSnap.exists() ? bSnap.val() : null;
            if (b && b.items && b.items.length) {
                for (let it of b.items) {
                    if (!it.mahsulotId) continue;
                    const mSnap = await get(ref(db, `mahsulotlar/${it.mahsulotId}`));
                    if (mSnap.exists()) { const m = mSnap.val(); await update(ref(db, `mahsulotlar/${it.mahsulotId}`), { soni: (parseInt(m.soni) || 0) + it.soni }); }
                }
            }
            await remove(ref(db, `buyurtmalar/${id}`));
            CACHE.buyurtmalar = null; CACHE.mahsulotlar = null;

        // ==================== ARIZA FORMI ====================
        async function renderArizaForm(container) {
            const user = await getCurrentUser();

            let userTurCounts = {};
