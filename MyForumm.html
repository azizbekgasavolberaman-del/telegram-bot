                            <option value="">-- Tanlang --</option>
                            ${Object.keys(turlar).map(key => { const t = turlar[key]; const limit = parseInt(t.maxLimit) || 0; const count = userTurCounts[key] || 0; const disabled = limit > 0 && count >= limit; return `<option value="${key}" ${disabled ? 'disabled' : ''}>${t.nomi} ${limit > 0 ? `(${count}/${limit})` : ''} ${disabled ? '(limit)' : ''}</option>`; }).join('')}
                        </select>
                    </div>
                    <div id="dinamikMaydonlar" class="space-y-4"></div>
                    <button id="submitArizaBtn" class="hidden w-full bg-gradient-to-r from-indigo-600 to-purple-600 text-white py-3.5 rounded-2xl font-bold shadow-lg hover:shadow-xl transition">Yuborish</button>
                </div>
            `;
            document.getElementById('selectArizaTuri').addEventListener('change', async (e) => {
                const key = e.target.value; const div = document.getElementById('dinamikMaydonlar'); div.innerHTML = '';
                if (!key) { document.getElementById('submitArizaBtn').classList.add('hidden'); return; }
                const maydonlarEntries = sortMaydonlar(turlar[key]?.maydonlar);
                let html = '';
                for (let [mId, m] of maydonlarEntries) {
                    const req = m.majburiy !== false;
                    html += `<div class="space-y-1"><label class="block text-sm font-medium text-gray-700">${m.nomi} <span class="text-xs text-indigo-500">(${m.turi})</span> ${req ? '<span class="text-red-500">*</span>' : '<span class="text-gray-400 text-xs">(ixtiyoriy)</span>'}</label>`;
                    if (m.turi === 'matn') html += `<input type="text" data-fid="${mId}" data-ftype="matn" data-req="${req}" class="ariza-field w-full px-4 py-3 border-2 border-indigo-200 rounded-2xl" ${req ? 'required' : ''}>`;
                    else if (m.turi === 'nomer') html += `<input type="number" data-fid="${mId}" data-ftype="nomer" data-req="${req}" class="ariza-field w-full px-4 py-3 border-2 border-indigo-200 rounded-2xl" ${req ? 'required' : ''}>`;

                        } else {
                            html += `<div class="checkbox-group border-2 border-indigo-200 rounded-2xl p-3 space-y-2" data-fid="${mId}" data-ftype="tanlov" data-req="${req}" data-max="${tanlovSoni}">`;
                            html += `<div class="text-xs text-indigo-600 font-medium">Kamida 1 ta, ko‘pi bilan ${tanlovSoni} ta tanlang</div>`;
                            vars.forEach((v) => { html += `<label class="flex items-center gap-2 text-sm"><input type="checkbox" value="${v}" class="ariza-checkbox accent-indigo-600"> ${v}</label>`; });
                            html += `</div>`;
                        }
                    }
                    else if (m.turi === 'rasm_tushish') html += `<div class="p-4 bg-indigo-50/50 rounded-2xl border-2 border-dashed border-indigo-300"><span class="text-xs text-indigo-600 font-bold"><i class="fa-regular fa-camera mr-1"></i>Kamera</span><input type="file" accept="image/*" capture="environment" data-fid="${mId}" data-ftype="rasm_tushish" data-req="${req}" class="ariza-field w-full mt-1 file-input" ${req ? 'required' : ''}></div>`;
                    else if (m.turi === 'galereyadan') html += `<div class="p-4 bg-purple-50/50 rounded-2xl border-2 border-dashed border-purple-300"><span class="text-xs text-purple-600 font-bold"><i class="fa-regular fa-images mr-1"></i>Galereya</span><input type="file" accept="image/*" multiple data-fid="${mId}" data-ftype="galereyadan" data-req="${req}" class="ariza-field w-full mt-1 file-input" ${req ? 'required' : ''}></div>`;
                    else if (m.turi === 'rasm') html += `<div class="p-4 bg-blue-50/50 rounded-2xl border-2 border-dashed border-blue-300"><span class="text-xs text-blue-600 font-bold"><i class="fa-regular fa-image mr-1"></i>Rasm</span><input type="file" accept="image/*" multiple data-fid="${mId}" data-ftype="rasm" data-req="${req}" class="ariza-field w-full mt-1 file-input" ${req ? 'required' : ''}></div>`;
                    else if (m.turi === 'video') html += `<div class="p-4 bg-rose-50/50 rounded-2xl border-2 border-dashed border-rose-300"><span class="text-xs text-rose-600 font-bold"><i class="fa-regular fa-video mr-1"></i>Video</span><input type="file" accept="video/*" data-fid="${mId}" data-ftype="video" data-req="${req}" class="ariza-field w-full mt-1 file-input" ${req ? 'required' : ''}></div>`;
                    else html += `<input type="file" data-fid="${mId}" data-ftype="file" data-req="${req}" class="ariza-field w-full px-4 py-3 border-2 border-indigo-200 rounded-2xl file-input" ${req ? 'required' : ''}>`;
                    html += `</div>`;
                }
                div.innerHTML = html;
                div.querySelectorAll('.checkbox-group').forEach(group => {

                    group.querySelectorAll('input[type="checkbox"]').forEach(cb => {
                        cb.addEventListener('change', () => {
                            const checked = group.querySelectorAll('input[type="checkbox"]:checked').length;
                            if (checked > max) { cb.checked = false; alert(`Ko'pi bilan ${max} ta tanlash mumkin!`); }

                    });
                });
                document.getElementById('submitArizaBtn').classList.toggle('hidden', !Object.keys(maydonlarEntries).length);

                const turKey = document.getElementById('selectArizaTuri').value; if (!turKey) return;

                const limit = parseInt(turlar[turKey].maxLimit) || 0; if (limit > 0 && cnt >= limit) { alert(`Limit tugagan (${limit})`); return; }
                const inputs = document.querySelectorAll('.ariza-field');
                const checkboxGroups = document.querySelectorAll('.ariza-field.checkbox-group');
                let data = {};
                async function readFile(file) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); }); }
                for (let inp of inputs) {
                    if (inp.classList.contains('checkbox-group')) continue;
                    const fid = inp.dataset.fid, ftype = inp.dataset.ftype, req = inp.dataset.req === 'true';
                    if (['rasm','video','file','rasm_tushish','galereyadan'].includes(ftype)) {
                        if (inp.files && inp.files.length) {
                            let files = []; for (let f of inp.files) { try { const b64 = await readFile(f); files.push({ nomi: f.name, url: b64 }); } catch(e) {} }
                            data[fid] = { turi: ftype, multiple: files.length > 1 || inp.multiple, files, nomi: files[0]?.nomi || '', url: files[0]?.url || '' };
                        } else { if (req) { alert("Majburiy fayl maydoni!"); return; } data[fid] = { turi: ftype, multiple: false, files: [], nomi: "", url: "" }; }
                    } else {
                        if (req && !inp.value.trim()) { alert("Majburiy maydon!"); inp.focus(); return; }
                        data[fid] = { turi: ftype, qiymat: inp.value };
                    }
                }
                for (let group of checkboxGroups) {
                    const fid = group.dataset.fid, req = group.dataset.req === 'true', max = parseInt(group.dataset.max);
                    const checked = [...group.querySelectorAll('input[type="checkbox"]:checked')].map(cb => cb.value);
                    if (req && checked.length === 0) { alert("Kamida bitta variant tanlang!"); return; }
                    if (checked.length > max) { alert(`Ko'pi bilan ${max} ta tanlash mumkin!`); return; }
                    data[fid] = { turi: 'tanlov', multiple: true, qiymat: checked.join(', '), variants: checked };
                }
                const hSnap = await get(ref(db, 'holatlar')); const holatlar = hSnap.exists() ? hSnap.val() : {};

                const raqam = Math.floor(100000 + Math.random() * 900000).toString();

                await set(ref(db, `arizalar/${raqam}`), yeni);

        function renderFieldItem(mKey, valObj) {
            if (!valObj) return '';
            if (typeof valObj === 'string') return `<div class="bg-gray-50 p-3 rounded-2xl border text-sm flex justify-between"><span class="text-gray-500 text-xs">${mKey}</span><span class="font-bold">${valObj}</span></div>`;
            let html = '';
            if (['rasm','rasm_tushish','galereyadan'].includes(valObj.turi)) {
                const files = valObj.files && valObj.files.length ? valObj.files : (valObj.url ? [{ nomi: valObj.nomi, url: valObj.url }] : []);
                if (files.length) {
                    const urls = files.map(f => f.url);
                    let imgs = `<div class="grid grid-cols-2 sm:grid-cols-3 gap-2 mt-2">`;
                    files.forEach((f, i) => { imgs += `<div class="bg-slate-900 rounded-xl overflow-hidden p-1 text-center cursor-pointer img-thumb" onclick="openImageViewer(${JSON.stringify(urls).replace(/"/g,'&quot;')},${i})"><img src="${f.url}" class="w-full h-32 object-contain rounded-lg"><span class="text-[10px] text-gray-300 truncate block">${f.nomi || 'Rasm'}</span></div>`; });
                    imgs += `</div>`;
                    html = `<div class="mt-1"><span class="text-xs text-indigo-600 font-bold"><i class="fa-regular fa-image mr-1"></i>Rasm:</span>${imgs}</div>`;
                } else html = `<span class="text-xs text-red-500">Rasm yo‘q</span>`;
            } else if (valObj.turi === 'video' && valObj.url) {
                html = `<div class="mt-1"><span class="text-xs text-purple-600 font-bold"><i class="fa-regular fa-video mr-1"></i>Video:</span><div class="bg-black rounded-xl overflow-hidden p-1 mt-1"><video controls class="w-full max-h-64 object-contain"><source src="${valObj.url}"></video></div></div>`;
            } else if (valObj.turi === 'file' && valObj.url) {
                html = `<div class="mt-1"><a href="${valObj.url}" download="${valObj.nomi || 'fayl'}" class="inline-flex items-center gap-2 bg-indigo-50 text-indigo-700 px-4 py-2 rounded-2xl text-xs font-bold hover:bg-indigo-100"><i class="fa-regular fa-download"></i>${valObj.nomi || 'Yuklab olish'}</a></div>`;
            } else if (valObj.turi === 'tanlov' && valObj.multiple && valObj.variants) {
                const badges = valObj.variants.map(v => `<span class="inline-block bg-purple-100 text-purple-700 text-xs px-2 py-0.5 rounded-full mr-1 mb-1">${v}</span>`).join('');
                html = `<div class="mt-1"><span class="text-xs text-purple-600 font-bold">Tanlanganlar:</span><div class="mt-1">${badges}</div></div>`;
            } else {
                const val = valObj.qiymat || '';
                let label = '';
                if (valObj.turi === 'sana') label = '<span class="text-[10px] bg-amber-100 text-amber-700 px-2 py-0.5 rounded-full ml-2">Sana</span>';

                else if (valObj.turi === 'tanlov') label = '<span class="text-[10px] bg-purple-100 text-purple-700 px-2 py-0.5 rounded-full ml-2">Tanlov</span>';
                html = `<span class="font-bold">${val}</span> ${label}`;
            }
            return `<div class="bg-gray-50 p-3 rounded-2xl border text-sm"><span class="text-gray-400 text-xs uppercase font-medium block">${mKey}</span>${html}</div>`;
        }

                        actions += `</div>`;
                    }

                    let holatData = null;
                    for (let hKey in holatlar) { if (holatlar[hKey].yozuv === a.holat) { holatData = holatlar[hKey]; break; } }
                    const showShtrix = holatData ? holatData.shtrixKorsatish !== false : true;
                    const showKod5 = holatData ? holatData.kod5Korsatish !== false : true;
                    const eslatma = holatData ? holatData.eslatma : '';

                    const kod5Html = showKod5 ? `<div class="text-center"><div class="text-[10px] uppercase font-bold text-amber-700">5 xonali kod</div><div class="text-xl font-extrabold text-amber-800 tracking-widest">${a.kod5 || '—'}</div></div>` : '';

                    html += `<div class="border p-5 rounded-3xl bg-white shadow-sm space-y-3">
                        <div class="flex justify-between items-center border-b pb-3 flex-wrap gap-2">
                            <div><span class="text-xs font-bold text-gray-400">ID:</span><span class="font-bold text-indigo-600 text-lg ml-2">${a.id}</span></div>

                        </div>

                        ${(kod5Html || shtrixHtml || eslatmaHtml) ? `<div class="flex flex-wrap gap-4 items-center bg-amber-50/60 p-3 rounded-2xl border border-amber-200">${kod5Html}${shtrixHtml}${eslatmaHtml}</div>` : ''}
                        <div class="grid grid-cols-1 gap-3">${qiymatlarHtml}</div>
                        ${javobHtml}${actions}
                    </div>`;
                }
                if (!found) html += `<div class="text-center py-10 text-gray-400">Arizalar mavjud emas</div>`;
                list.innerHTML = html;

        window.userDeleteAriza = async function(id) { if (confirm("O'chirilsin?")) { await remove(ref(db, `arizalar/${id}`)); CACHE.arizalar = null; renderArizalarim(document.getElementById('tabContent')); } };

                else if (m.turi === 'nomer') fields += `<input type="number" data-fid="${mId}" data-ftype="nomer" data-req="${req}" value="${oldVal}" class="edit-ariza-field w-full px-4 py-3 border-2 border-indigo-200 rounded-2xl" ${req ? 'required' : ''}>`;

                else if (m.turi === 'tanlov') {
                    const vars = m.variantlar ? m.variantlar.split(',').map(v => v.trim()).filter(Boolean) : [];
                    const tanlovSoni = m.tanlovSoni ? parseInt(m.tanlovSoni) : 1;
                    const oldVariants = old.variants || [];
                    if (tanlovSoni <= 1) {
                        fields += `<select data-fid="${mId}" data-ftype="tanlov" data-req="${req}" class="edit-ariza-field w-full px-4 py-3.5 border-2 border-indigo-200 rounded-2xl bg-white" ${req ? 'required' : ''}><option value="">-- Tanlang --</option>${vars.map(v => `<option value="${v}" ${oldVal === v ? 'selected' : ''}>${v}</option>`).join('')}</select>`;

                        fields += `</div>`;
                    }
                }
                else if (m.turi === 'rasm_tushish') fields += `<div class="p-3 bg-indigo-50/50 rounded-2xl"><input type="file" accept="image/*" capture="environment" data-fid="${mId}" data-ftype="rasm_tushish" data-req="false" class="edit-ariza-field w-full file-input"></div>`;
                else if (m.turi === 'galereyadan') fields += `<div class="p-3 bg-purple-50/50 rounded-2xl"><input type="file" accept="image/*" multiple data-fid="${mId}" data-ftype="galereyadan" data-req="false" class="edit-ariza-field w-full file-input"></div>`;
                else if (m.turi === 'rasm') fields += `<div class="p-3 bg-blue-50/50 rounded-2xl"><input type="file" accept="image/*" multiple data-fid="${mId}" data-ftype="rasm" data-req="false" class="edit-ariza-field w-full file-input"></div>`;

                else fields += `<input type="file" data-fid="${mId}" data-ftype="file" data-req="false" class="edit-ariza-field w-full px-4 py-3 border-2 border-indigo-200 rounded-2xl file-input">`;
                fields += `</div>`;
            }

                            <button onclick="regenerateShtrixKod('ariza','${arizaId}')" class="bg-blue-600 text-white px-2 py-1 rounded-lg text-[10px] font-bold">🔄 Qayta</button>
                            <button onclick="deleteShtrixKod('ariza','${arizaId}')" class="bg-red-600 text-white px-2 py-1 rounded-lg text-[10px] font-bold">🗑 O'chirish</button>
                        </div>
                    </div>
                    <div class="md:col-span-2 text-[10px] text-gray-500 italic"><i class="fa-solid fa-shield-halved mr-1"></i>Faqat admin shtrix va 5 xonali kodni o'zgartira oladi.</div>

                        <div class="flex justify-end gap-2 pt-3 border-t"><button onclick="closeModal()" class="px-5 py-2.5 bg-gray-100 rounded-2xl font-bold">Bekor</button><button onclick="saveEditedTexnik('${tKey}')" class="px-6 py-2.5 bg-indigo-600 text-white rounded-2xl font-bold shadow">Saqlash</button></div>
                    </div>
                </div>
            `;
        };
        window.saveEditedTexnik = async function(tKey) {
            const sarlavha = document.getElementById('editTexnikSarlavha').value.trim(); const matn = document.getElementById('editTexnikMatn').value.trim();
            if (!sarlavha || !matn) { alert("To‘ldiring!"); return; }
            await update(ref(db, `texnikIshlar/${tKey}`), { sarlavha, matn });
            closeModal(); renderAdminTexnik(document.getElementById('tabContent'));
        };
        window.deleteTexnik = async function(tKey) { if (confirm("O'chirilsin?")) { await remove(ref(db, `texnikIshlar/${tKey}`)); renderAdminTexnik(document.getElementById('tabContent')); } };

        initSystem();
    </script>
</body>
</html>
